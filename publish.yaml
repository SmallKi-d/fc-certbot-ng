Edition: 3.0.0
Type: Project
Name: fc-certbot-ng
Version: 0.1.0
Provider:
  - 阿里云
Description: 基于 Python 3.12、Node.js 20 和新版 cryptography 的阿里云函数计算证书签发与自动轮换。
HomePage: https://github.com/SmallKi-d/fc-certbot-ng
Tags:
  - Certbot
  - Python3.12
  - Node.js20
  - Let's Encrypt
Category: 其它
Service:
  函数计算:
    Authorities:
      - AliyunFCFullAccess
Effective: Public
Parameters:
  type: object
  additionalProperties: false
  required:
    - fcDomainManagerFunctionName
    - certGeneratorFunctionName
    - role
    - certbotEmail
  properties:
    certbotEmail:
      title: ACME 账号邮箱
      type: string
      format: email
      description: 用于 Let's Encrypt 账号注册和证书通知，请填写真实邮箱。
    fcDomainManagerFunctionName:
      title: Domain Manager 函数名
      type: string
      default: fc-domain-manager-${default-suffix}
      description: Domain Manager 函数的名称
    certGeneratorFunctionName:
      title: Cert Generator 函数名
      type: string
      default: cert-generator-${default-suffix}
      description: Cert Generator 函数的名称
    role:
      title: RAM 角色
      type: string
      default: ""
      description: 我们会用此角色生成临时密钥来访问 CAS，DNS 和 FC。
      x-role:
        type: object
        pattern: "^acs:ram::[0-9]*:role/.*$"
        service: fc
        description: 我们会用此角色生成临时密钥来访问 CAS，DNS 和 FC。
        authorities:
          - AliyunDNSFullAccess
          - AliyunFCFullAccess
          - AliyunYundunCertFullAccess
