name: publish package to registry

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org/
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make jq curl wget
      - name: install s
        run: |
          npm i @serverless-devs/s@v3 -g
      - name: s registry login
        run: |
          s registry login --token ${{ secrets.alibaba_registry_v3_publish_token }}
      - name: Prepare initialized application template
        run: node scripts/prepare-template.js
      - name: release prod
        working-directory: .release/fc-certbot-ng
        run: |
          s registry publish
